<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Dark background -->
  <rect width="64" height="64" fill="#2d2d2d" rx="8"/>
  
  <!-- Red alert circle -->
  <circle cx="32" cy="32" r="26" fill="#c0392b"/>
  
  <!-- White siren light rays -->
  <g fill="white" opacity="0.9">
    <!-- Top rays -->
    <rect x="30" y="8" width="4" height="6" rx="2"/>
    <!-- Right rays -->
    <rect x="50" y="30" width="6" height="4" rx="2"/>
    <!-- Bottom rays -->
    <rect x="30" y="50" width="4" height="6" rx="2"/>
    <!-- Left rays -->
    <rect x="8" y="30" width="6" height="4" rx="2"/>
  </g>
  
  <!-- Center white circle (siren base) -->
  <circle cx="32" cy="32" r="14" fill="white"/>
  
  <!-- Red center dot -->
  <circle cx="32" cy="32" r="8" fill="#c0392b"/>
</svg>
